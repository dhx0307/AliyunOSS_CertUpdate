name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *" # 时区对cron无效，所以要提前8个小时，
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=${{ secrets.EMAIL }}
          # 将 acme.sh 添加到环境变量，方便后续直接调用
          echo "$HOME/.acme.sh" >> $GITHUB_PATH

      - name: Aliyun Cli Tools
        run: |
          curl -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzvf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          sudo aliyun configure set --profile akProfile --mode AK \
            --access-key-id ${{ secrets.ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ACCESS_KEY_SECRET }} \
            --region ${{ secrets.REGION }}

          sudo mv alidns.sh /usr/local/bin/alidns
          sudo chmod +x /usr/local/bin/alidns

      - name: Issue Certificate with acme.sh (Staging)
        env:
          Ali_Key: ${{ secrets.ACCESS_KEY_ID }}
          Ali_Secret: ${{ secrets.ACCESS_KEY_SECRET }}
        run: |
          # 清理可能存在的旧配置
          acme.sh --remove -d "${{ secrets.DOMAIN }}" || true
          
          # 申请测试证书（加上 --dnssleep 120，给 DNS 传播留足时间）
          acme.sh --issue --dns dns_ali -d "${{ secrets.DOMAIN }}" --server letsencrypt_test --dnssleep 120
          
          # 关键修复：创建目标目录并赋予当前用户权限
          sudo mkdir -p /etc/letsencrypt/live/${{ secrets.DOMAIN }}
          sudo chown -R $USER:$USER /etc/letsencrypt/live/
          
          # 安装证书（此时目录已存在，且有写入权限）
          acme.sh --install-cert -d "${{ secrets.DOMAIN }}" \
            --key-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/privkey.pem \
            --fullchain-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/fullchain.pem

      - name: Deploy Cert to OSS and CDN
        env:
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          REGION: ${{ secrets.REGION }}
          CERT_PATH: /etc/letsencrypt/live/${{ secrets.DOMAIN }}
        run: |
          # 1. 用户级安装依赖（绝对不要用 sudo pip）
          pip install --user --upgrade oss2
          
          # 2. 复制证书到临时目录，并赋予当前用户权限
          sudo cp $CERT_PATH/fullchain.pem /tmp/fullchain.pem
          sudo cp $CERT_PATH/privkey.pem /tmp/privkey.pem
          sudo chown $USER:$USER /tmp/fullchain.pem /tmp/privkey.pem
          
          # 3. 更新 OSS（修正了方法名：put_bucket_cname）
          echo "正在更新 OSS..."
          python3 -c "
          import os, oss2
          with open('/tmp/fullchain.pem', 'r') as f: cert = f.read()
          with open('/tmp/privkey.pem', 'r') as f: key = f.read()
          auth = oss2.Auth(os.environ['ACCESS_KEY_ID'], os.environ['ACCESS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, os.environ['ENDPOINT'], os.environ['BUCKET_NAME'], region=os.environ['REGION'])
          bucket.put_bucket_cname(os.environ['DOMAIN'], cert, key)
          print('OSS 更新成功！')
          "
          
          # 4. 更新 CDN（用官方 CLI 的 file:// 技巧，彻底避开多行文本崩溃）
          echo "正在更新 CDN..."
          aliyun cdn SetDomainServerCertificate \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --region "${{ secrets.REGION }}" \
            --DomainName "${{ secrets.DOMAIN }}" \
            --SSLProtocol on \
            --ServerCertificate file:///tmp/fullchain.pem \
            --PrivateKey file:///tmp/privkey.pem
          
          echo "全部证书部署完成！"
