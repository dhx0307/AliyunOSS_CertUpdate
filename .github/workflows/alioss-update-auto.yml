name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *" # 时区对cron无效，所以要提前8个小时，
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=${{ secrets.EMAIL }}
          # 将 acme.sh 添加到环境变量，方便后续直接调用
          echo "$HOME/.acme.sh" >> $GITHUB_PATH

      - name: Aliyun Cli Tools
        run: |
          curl -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzvf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          sudo aliyun configure set --profile akProfile --mode AK \
            --access-key-id ${{ secrets.ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ACCESS_KEY_SECRET }} \
            --region ${{ secrets.REGION }}

          sudo mv alidns.sh /usr/local/bin/alidns
          sudo chmod +x /usr/local/bin/alidns

      - name: Issue Certificate with acme.sh (Staging)
        env:
          Ali_Key: ${{ secrets.ACCESS_KEY_ID }}
          Ali_Secret: ${{ secrets.ACCESS_KEY_SECRET }}
        run: |
          # 清理可能存在的旧配置
          acme.sh --remove -d "${{ secrets.DOMAIN }}" || true
          
          # 申请测试证书（加上 --dnssleep 120，给 DNS 传播留足时间）
          acme.sh --issue --dns dns_ali -d "${{ secrets.DOMAIN }}" --server letsencrypt_test --dnssleep 120
          
          # 关键修复：创建目标目录并赋予当前用户权限
          sudo mkdir -p /etc/letsencrypt/live/${{ secrets.DOMAIN }}
          sudo chown -R $USER:$USER /etc/letsencrypt/live/
          
          # 安装证书（此时目录已存在，且有写入权限）
          acme.sh --install-cert -d "${{ secrets.DOMAIN }}" \
            --key-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/privkey.pem \
            --fullchain-file /etc/letsencrypt/live/${{ secrets.DOMAIN }}/fullchain.pem

      - name: Deploy Cert to OSS and CDN
        run: |
          # 1. 确保 oss2 是最新版本
          sudo pip install --upgrade oss2
          
          # 2. 设置证书路径
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          
          # 3. 写入 Python 脚本
          cat << 'EOF' > /tmp/update_cert.py
          import os
          import sys
          import oss2
          
          # 手动从环境变量读取，如果没有就读不到
          ak_id = os.environ.get('ACCESS_KEY_ID')
          ak_secret = os.environ.get('ACCESS_KEY_SECRET')
          endpoint = os.environ.get('ENDPOINT')
          bucket_name = os.environ.get('BUCKET_NAME')
          domain = os.environ.get('DOMAIN')
          region = os.environ.get('REGION')
          cert_path = os.environ.get('CERT_PATH')
          
          if not all([ak_id, ak_secret, endpoint, bucket_name, domain, region, cert_path]):
              print("Error: Missing environment variables!", file=sys.stderr)
              sys.exit(1)
          
          with open(os.path.join(cert_path, 'fullchain.pem'), 'r') as f:
              cert_content = f.read()
          with open(os.path.join(cert_path, 'privkey.pem'), 'r') as f:
              private_key = f.read()
          
          print('正在通过 OSS SDK 更新自定义域名证书...')
          auth = oss2.Auth(ak_id, ak_secret)
          bucket = oss2.Bucket(auth, endpoint, bucket_name, region=region)
          bucket.put_cname(domain, cert_content, private_key)
          print('OSS 证书更新成功！')
          EOF
          
          # 4. 执行脚本（显式传递变量，并强制输出错误）
          sudo ACCESS_KEY_ID="${{ secrets.ACCESS_KEY_ID }}" \
               ACCESS_KEY_SECRET="${{ secrets.ACCESS_KEY_SECRET }}" \
               ENDPOINT="${{ secrets.ENDPOINT }}" \
               BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
               DOMAIN="${{ secrets.DOMAIN }}" \
               REGION="${{ secrets.REGION }}" \
               CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}" \
               python3 /tmp/update_cert.py 2>&1
          
          # 5. CDN 部分（先注释掉，手动去控制台更新）
          # echo "正在更新 CDN 证书..."
          # aliyun cdn SetDomainServerCertificate --DomainName "${{ secrets.DOMAIN }}" --SSLProtocol on --ServerCertificate "$(sudo cat $CERT_PATH/fullchain.pem)" --PrivateKey "$(sudo cat $CERT_PATH/privkey.pem)"
          
          echo "OSS 证书部署完成！"
