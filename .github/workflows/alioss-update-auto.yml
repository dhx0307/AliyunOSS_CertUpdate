name: alioss-update-auto

on:
  schedule:
    # cron 使用 UTC：每周二 20:00 UTC = 北京时间每周三 04:00
    # 每周只"检查"，证书剩余 <30 天才真正申请，避免触发 Let's Encrypt 频率限制
    - cron: "0 20 * * 2"
  workflow_dispatch:
    inputs:
      staging:
        description: "测试模式：用 Let's Encrypt 测试环境申请证书，不部署（不消耗正式额度）"
        type: boolean
        default: false
      deploy_staging:
        description: "配合测试模式：把测试证书也部署到 OSS/CDN（浏览器会提示不安全，仅用于演练流程）"
        type: boolean
        default: false
      force:
        description: "强制申请新证书（忽略剩余有效期检查，会消耗正式额度！）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 先看线上证书还剩多久，够久就整个跳过，不去申请新证书
      - name: Check live certificate
        id: check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          STAGING: ${{ inputs.staging }}
          FORCE: ${{ inputs.force }}
        run: |
          DAYS=0
          # 加超时：域名连不上时最多等 15 秒，不能无限挂住
          PEM=$(echo | timeout 15 openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null \
                | openssl x509 2>/dev/null || true)
          if [ -n "$PEM" ]; then
            END=$(echo "$PEM" | openssl x509 -noout -enddate | cut -d= -f2)
            ISSUER=$(echo "$PEM" | openssl x509 -noout -issuer)
            echo "线上证书签发者：$ISSUER"
            DAYS=$(( ( $(date -d "$END" +%s) - $(date +%s) ) / 86400 ))
            # 线上是测试证书（不被信任）时，视为需要立即换成正式证书
            if echo "$ISSUER" | grep -qi "staging"; then
              echo "检测到线上是测试证书，视为需要更换"
              DAYS=0
            fi
          fi
          echo "线上证书剩余天数：$DAYS"

          if [ "$STAGING" = "true" ] || [ "$FORCE" = "true" ] || [ "$DAYS" -lt 30 ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          else
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "证书还很充裕，本次跳过申请。"
          fi

      - name: Init Action
        if: steps.check.outputs.need == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq certbot
          pip install -r requirements.txt

      # certbot 以 sudo 运行，alidns.sh 会读取 root 的 aliyun 配置，
      # 所以这里保留 sudo configure（原项目的做法）
      - name: Aliyun Cli Tools
        if: steps.check.outputs.need == 'true'
        run: |
          curl -fsSL -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          sudo aliyun configure set --profile akProfile --mode AK \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --region "${{ secrets.REGION }}"

          sudo mv alidns.sh /usr/local/bin/alidns
          sudo chmod +x /usr/local/bin/alidns

      - name: Apply for a new certificate
        if: steps.check.outputs.need == 'true'
        run: |
          EXTRA=""
          if [ "${{ inputs.staging }}" = "true" ]; then EXTRA="--test-cert"; fi
          # 记录写入后多等 90 秒，让阿里云 DNS 各节点同步完，再让 Let's Encrypt 去验证
          # DNS 验证偶发失败（如 SERVFAIL）时，最多重试 3 次
          OK=0
          for i in 1 2 3; do
            if sudo certbot certonly -d "${{ secrets.DOMAIN }}" --manual --preferred-challenges dns \
                  --manual-auth-hook "/usr/local/bin/alidns && sleep 90" \
                  --manual-cleanup-hook "/usr/local/bin/alidns clean" \
                  --agree-tos --email "${{ secrets.EMAIL }}" --non-interactive $EXTRA; then
              OK=1
              break
            fi
            echo "第 $i 次申请失败，60 秒后重试"
            sleep 60
          done
          [ "$OK" = "1" ]

      - name: Run OSS Cert Update
        if: steps.check.outputs.need == 'true' && (inputs.staging != true || inputs.deploy_staging == true)
        run: |
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          export CERTIFICATE="$(sudo cat $CERT_PATH/fullchain.pem)"
          export PRIVATE_KEY="$(sudo cat $CERT_PATH/privkey.pem)"
          python oss_update.py \
            --access-key-id "${{ secrets.ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ACCESS_KEY_SECRET }}" \
            --endpoint "${{ secrets.ENDPOINT }}" \
            --bucket-name "${{ secrets.BUCKET_NAME }}" \
            --target-cname "${{ secrets.DOMAIN }}" \
            --private-key "$PRIVATE_KEY" \
            --certificate "$CERTIFICATE"

      # 更新 CDN 证书（用 sudo，复用上面给 root 配好的 aliyun 凭证）
      - name: Update CDN Cert
        if: steps.check.outputs.need == 'true' && (inputs.staging != true || inputs.deploy_staging == true)
        run: |
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          CERT_NAME="cert-$(date -u +%Y%m%d%H%M%S)"
          sudo aliyun cdn SetCdnDomainSSLCertificate \
            --DomainName "${{ secrets.DOMAIN }}" \
            --CertName "$CERT_NAME" \
            --CertType upload \
            --SSLProtocol on \
            --SSLPub "$(sudo cat $CERT_PATH/fullchain.pem)" \
            --SSLPri "$(sudo cat $CERT_PATH/privkey.pem)"
          echo "CDN 证书更新完成：$CERT_NAME"
