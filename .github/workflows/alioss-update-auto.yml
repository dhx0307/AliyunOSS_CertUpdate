name: alioss-update-auto

on:
  schedule:
    # cron 使用 UTC：每月 2 日 20:00 UTC = 北京时间每月 3 日 04:00
    - cron: "0 20 2 * *"
  workflow_dispatch:
    inputs:
      staging:
        description: "仅申请 Let's Encrypt 测试证书（不部署，用于调试 DNS 验证）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOMAIN: ${{ secrets.DOMAIN }}
  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
  # REGION 必须是形如 cn-hangzhou 的地域 ID（不要带 oss- 前缀）
  REGION: ${{ secrets.REGION }}
  CERT_DIR: ${{ github.workspace }}/.cert

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 1. 申请证书 ----------
      - name: Install acme.sh
        env:
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          curl -fsSL https://get.acme.sh | sh -s email="$EMAIL"
          echo "$HOME/.acme.sh" >> "$GITHUB_PATH"

      - name: Issue certificate (DNS-01 via Aliyun DNS)
        env:
          Ali_Key: ${{ secrets.ACCESS_KEY_ID }}
          Ali_Secret: ${{ secrets.ACCESS_KEY_SECRET }}
          STAGING: ${{ inputs.staging }}
        run: |
          set -euo pipefail
          if [ "$STAGING" = "true" ]; then
            SERVER=letsencrypt_test
          else
            SERVER=letsencrypt
          fi

          # runner 每次都是全新环境，没有历史证书，直接签发即可
          ~/.acme.sh/acme.sh --issue --dns dns_ali -d "$DOMAIN" \
            --server "$SERVER" --dnssleep 120

          mkdir -p "$CERT_DIR"
          ~/.acme.sh/acme.sh --install-cert -d "$DOMAIN" \
            --fullchain-file "$CERT_DIR/fullchain.pem" \
            --key-file "$CERT_DIR/privkey.pem"
          chmod 600 "$CERT_DIR/privkey.pem"

          echo "证书有效期："
          openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -subject -issuer -dates

      # ---------- 2. 安装工具 ----------
      - name: Install aliyun-cli and ossutil 2.x
        if: ${{ inputs.staging != true }}
        env:
          OSSUTIL_VERSION: "2.4.0"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          # aliyun-cli
          curl -fsSL -o aliyun-cli.tgz \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli.tgz
          mv aliyun "$HOME/bin/aliyun"

          # ossutil 2.x（旧版 1.7.x 没有 `api put-cname` 子命令）
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q -o ossutil.zip
          mv "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" "$HOME/bin/ossutil"
          chmod +x "$HOME/bin/ossutil"

          sudo apt-get install -y -qq jq >/dev/null

      # ---------- 3. 部署到 OSS 自定义域名 ----------
      - name: Deploy cert to OSS custom domain
        if: ${{ inputs.staging != true }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.REGION }}
        run: |
          set -euo pipefail

          # 用 jq 生成 JSON，自动处理证书里的换行转义
          jq -n --arg domain "$DOMAIN" \
                --rawfile cert "$CERT_DIR/fullchain.pem" \
                --rawfile key  "$CERT_DIR/privkey.pem" \
            '{Cname:{Domain:$domain,CertificateConfiguration:{Certificate:$cert,PrivateKey:$key,Force:true}}}' \
            > "$RUNNER_TEMP/put_cname.json"

          ossutil api put-cname \
            --bucket "$BUCKET_NAME" \
            --region "$OSS_REGION" \
            --cname-configuration "file://$RUNNER_TEMP/put_cname.json"

          rm -f "$RUNNER_TEMP/put_cname.json"
          echo "OSS 证书更新完成"

      # ---------- 4. 部署到 CDN ----------
      - name: Deploy cert to CDN
        if: ${{ inputs.staging != true }}
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION_ID: ${{ secrets.REGION }}
        run: |
          set -euo pipefail
          # 证书名称需唯一，带上时间戳
          CERT_NAME="cert-$(date -u +%Y%m%d%H%M%S)"

          aliyun cdn SetCdnDomainSSLCertificate \
            --DomainName "$DOMAIN" \
            --CertName "$CERT_NAME" \
            --CertType upload \
            --SSLProtocol on \
            --SSLPub "$(cat "$CERT_DIR/fullchain.pem")" \
            --SSLPri "$(cat "$CERT_DIR/privkey.pem")"

          echo "CDN 证书更新完成：$CERT_NAME"

      # ---------- 5. 清理 ----------
      - name: Cleanup
        if: always()
        run: rm -rf "$CERT_DIR" "$HOME/.acme.sh"
