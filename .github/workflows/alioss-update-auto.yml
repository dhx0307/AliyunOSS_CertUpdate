name: alioss-update-auto
env:
  TZ: Asia/Shanghai

on:
  schedule:
    - cron: "0 20 2 * *" # 时区对cron无效，所以要提前8个小时，
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Init Action
        run: |
          sudo apt install -y certbot
          pip install -r requirements.txt

      - name: Aliyun Cli Tools
        run: |
          curl -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzvf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/
          sudo aliyun configure set --profile akProfile --mode AK \
            --access-key-id ${{ secrets.ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ACCESS_KEY_SECRET }} \
            --region ${{ secrets.REGION }}

          sudo mv alidns.sh /usr/local/bin/alidns
          sudo chmod +x /usr/local/bin/alidns

      - name: Apply for a new certificate
        run: |
          sudo mkdir -p /etc/letsencrypt/certs
          # 注意这里加上了 --staging，使用测试环境避免触发频率限制
          sudo certbot certonly --staging -d "${{ secrets.DOMAIN }}" --manual --preferred-challenges dns \
                --manual-auth-hook "/usr/local/bin/alidns" \
                --manual-cleanup-hook "/usr/local/bin/alidns clean" \
                --agree-tos --email ${{ secrets.EMAIL }} --non-interactive

      - name: Deploy Cert to OSS and CDN
        env:
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          REGION: ${{ secrets.REGION }}
        run: |
          # 1. 安装阿里云 OSS Python SDK
          pip install oss2
          
          # 2. 设置证书路径
          CERT_PATH="/etc/letsencrypt/live/${{ secrets.DOMAIN }}"
          export CERT_PATH
          
          # 3. 使用内联 Python 脚本直接更新 OSS 证书（绕过区域报错）
          python3 -c "
          import os
          import oss2
          
          auth = oss2.Auth(os.environ['ACCESS_KEY_ID'], os.environ['ACCESS_KEY_SECRET'])
          # 注意：这里明确传入 region，避免 SDK 默认回退到杭州
          bucket = oss2.Bucket(auth, os.environ['ENDPOINT'], os.environ['BUCKET_NAME'], region=os.environ['REGION'])
          
          with open(os.environ['CERT_PATH'] + '/fullchain.pem', 'r') as f:
              cert = f.read()
          with open(os.environ['CERT_PATH'] + '/privkey.pem', 'r') as f:
              key = f.read()
          
          print('正在更新 OSS 自定义域名证书...')
          bucket.put_cname(os.environ['DOMAIN'], cert, key)
          print('OSS 证书更新成功！')
          "
          
          # 4. 使用阿里云 CLI 同步更新 CDN 证书
          echo "正在更新 CDN 证书..."
          CERTIFICATE="$(sudo cat $CERT_PATH/fullchain.pem)"
          PRIVATE_KEY="$(sudo cat $CERT_PATH/privkey.pem)"
          aliyun cdn SetDomainServerCertificate --DomainName "${{ secrets.DOMAIN }}" --SSLProtocol on --ServerCertificate "$CERTIFICATE" --PrivateKey "$PRIVATE_KEY"
          
          echo "所有证书部署完成！"
